
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zynx AI</title>
<style>
:root {
  --bg:#080b14;--panel:#101625;--panel2:#151e30;
  --text:#edf2ff;--muted:#8995ad;--accent:#8b5cf6;
  --accent2:#22d3ee;--border:#263149;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;height:100vh;overflow:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{height:100vh;display:flex}
.sidebar{width:260px;background:#0c1120;border-right:1px solid var(--border);padding:18px;display:flex;flex-direction:column;gap:16px}
.logo{font-size:25px;font-weight:800;letter-spacing:1px;background:linear-gradient(90deg,#a78bfa,#22d3ee);background-clip:text;color:transparent}
.new-chat,.side-button{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:12px;border-radius:10px;text-align:left}
.new-chat:hover,.side-button:hover{border-color:var(--accent)}
.side-label{font-size:12px;color:var(--muted);margin-top:12px}
.history{overflow:auto;flex:1}
.history-item{padding:10px;border-radius:8px;color:#b9c4d8;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-item:hover{background:var(--panel2)}
.profile{border-top:1px solid var(--border);padding-top:15px;display:flex;align-items:center;justify-content:space-between}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:65px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.model{color:#b9c4d8;font-size:13px}
.status{font-size:12px;color:#4ade80}
.messages{flex:1;overflow-y:auto;padding:28px 20px}
.welcome{max-width:760px;margin:10vh auto;text-align:center}
.welcome h1{font-size:42px;margin-bottom:10px}
.gradient{background:linear-gradient(90deg,#a78bfa,#22d3ee);background-clip:text;color:transparent}
.welcome p{color:var(--muted)}
.suggestions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:30px}
.suggestion{background:var(--panel);border:1px solid var(--border);padding:12px 15px;border-radius:12px;color:#cbd5e1}
.suggestion:hover{border-color:var(--accent)}
.message{max-width:850px;margin:0 auto 24px;display:flex;gap:13px;line-height:1.7}
.avatar{width:34px;height:34px;flex:none;border-radius:10px;background:var(--panel2);display:grid;place-items:center}
.content{min-width:0;overflow-wrap:anywhere}
.content pre{background:#050914;padding:15px;border-radius:10px;overflow:auto}
.content code{background:#202a40;padding:2px 5px;border-radius:5px}
.content pre code{background:none;padding:0}
.composer-wrap{padding:15px 20px 20px}
.composer{max-width:850px;margin:auto;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:flex-end}
textarea{flex:1;resize:none;min-height:44px;max-height:180px;background:transparent;border:0;outline:0;color:var(--text);padding:10px}
.send{background:var(--accent);color:white;border:0;border-radius:11px;padding:12px 18px;font-weight:700}
.send:disabled{opacity:.5;cursor:not-allowed}
.hint{text-align:center;font-size:11px;color:var(--muted);margin-top:9px}
.auth-btn{background:transparent;color:#c4b5fd;border:1px solid var(--border);padding:9px 13px;border-radius:9px}
.menu-btn{display:none}
@media(max-width:700px){
 .sidebar{display:none}.menu-btn{display:block}.topbar{padding:0 12px}
 .welcome h1{font-size:32px}.messages{padding:20px 12px}
 .composer-wrap{padding:10px}.message{gap:8px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">ZYNX AI</div>
    <button class="new-chat" id="newChat">＋ New chat</button>
    <div class="side-label">YOUR CONVERSATIONS</div>
    <div class="history" id="history"></div>
    <div class="profile">
      <div>
        <strong id="userName">Guest User</strong>
        <div class="side-label" id="userStatus">Free guest access</div>
      </div>
      <button class="auth-btn" id="loginButton">Sign in</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <button class="menu-btn side-button" id="mobileNew">＋</button>
        <strong>Zynx AI</strong>
        <span class="model"> · AI Assistant</span>
      </div>
      <div>
        <span class="status" id="connectionStatus">● Ready</span>
      </div>
    </header>

    <section class="messages" id="messages">
      <div class="welcome" id="welcome">
        <h1>Welcome to <span class="gradient">Zynx AI</span></h1>
        <p>Your intelligent AI assistant. Ask anything. No sign-in required.</p>
        <div class="suggestions">
          <button class="suggestion">Explain artificial intelligence simply</button>
          <button class="suggestion">Create a Python project</button>
          <button class="suggestion">Give me innovative science ideas</button>
          <button class="suggestion">Help me learn programming</button>
        </div>
      </div>
    </section>

    <footer class="composer-wrap">
      <div class="composer">
        <textarea id="prompt" placeholder="Message Zynx AI..." rows="1"></textarea>
        <button class="send" id="sendButton">Send ↑</button>
      </div>
      <div class="hint">Zynx AI can make mistakes. Verify important information.</div>
    </footer>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);

let user = {name:"Guest User", guest:true};
let chats = JSON.parse(localStorage.getItem("zynx_guest_chats") || "[]");
let activeChat = null;
let busy = false;

function saveChats(){
  localStorage.setItem("zynx_guest_chats",JSON.stringify(chats));
}

function newChat(){
  activeChat = {id:Date.now(),title:"New chat",messages:[]};
  chats.unshift(activeChat);
  saveChats();
  render();
}

function render(){
  $("messages").innerHTML = "";

  if(!activeChat || activeChat.messages.length===0){
    $("messages").innerHTML = `
      <div class="welcome" id="welcome">
        <h1>Welcome to <span class="gradient">Zynx AI</span></h1>
        <p>Your intelligent AI assistant. Ask anything. No sign-in required.</p>
        <div class="suggestions">
          <button class="suggestion">Explain artificial intelligence simply</button>
          <button class="suggestion">Create a Python project</button>
          <button class="suggestion">Give me innovative science ideas</button>
          <button class="suggestion">Help me learn programming</button>
        </div>
      </div>`;
    document.querySelectorAll(".suggestion").forEach(btn=>{
      btn.onclick=()=>{ $("prompt").value=btn.textContent; sendMessage(); };
    });
  } else {
    activeChat.messages.forEach(m=>addMessage(m.role,m.content));
  }

  $("history").innerHTML = "";
  chats.forEach(chat=>{
    const item=document.createElement("div");
    item.className="history-item";
    item.textContent=chat.title;
    item.onclick=()=>{activeChat=chat;render();};
    $("history").appendChild(item);
  });

  $("messages").scrollTop=$("messages").scrollHeight;
}

function addMessage(role,text){
  const row=document.createElement("div");
  row.className="message";

  const avatar=document.createElement("div");
  avatar.className="avatar";
  avatar.textContent=role==="user"?"You":"✦";

  const content=document.createElement("div");
  content.className="content";
  content.textContent=text;

  row.append(avatar,content);
  $("messages").appendChild(row);
  return content;
}

async function sendMessage(){
  if(busy)return;

  const input=$("prompt");
  const text=input.value.trim();
  if(!text)return;

  if(!activeChat)newChat();

  input.value="";
  activeChat.messages.push({role:"user",content:text});

  if(activeChat.messages.length===1){
    activeChat.title=text.slice(0,35);
  }

  addMessage("user",text);
  const replyBox=addMessage("assistant","Thinking...");
  busy=true;
  $("sendButton").disabled=true;
  $("connectionStatus").textContent="● Connecting to AI...";

  try{
    const response=await fetch("/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      credentials:"same-origin",
      body:JSON.stringify({
        messages:activeChat.messages.map(m=>({
          role:m.role,
          content:m.content
        })),
        mode:"chat",
        guest:true
      })
    });

    const data=await response.json();

    if(!response.ok){
      throw new Error(data.error || data.reply || `Server error: ${response.status}`);
    }

    const answer=data.reply || data.response || data.message ||
      data.choices?.[0]?.message?.content;

    if(!answer)throw new Error("The server returned no AI reply.");

    replyBox.textContent=answer;
    activeChat.messages.push({role:"assistant",content:answer});
    $("connectionStatus").textContent="● AI Connected";
  }catch(error){
    replyBox.textContent="I couldn't get a reply from the AI server. " + error.message;
    $("connectionStatus").textContent="● Connection error";
    console.error("Zynx AI:",error);
  }finally{
    busy=false;
    $("sendButton").disabled=false;
    saveChats();
    renderHistoryOnly();
    $("messages").scrollTop=$("messages").scrollHeight;
  }
}

function renderHistoryOnly(){
  $("history").innerHTML="";
  chats.forEach(chat=>{
    const item=document.createElement("div");
    item.className="history-item";
    item.textContent=chat.title;
    item.onclick=()=>{activeChat=chat;render();};
    $("history").appendChild(item);
  });
}

$("sendButton").onclick=sendMessage;
$("prompt").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

$("newChat").onclick=newChat;
$("mobileNew").onclick=newChat;

// Guest access is enabled by default.
$("userName").textContent="Guest User";
$("userStatus").textContent="Free guest access";
$("loginButton").onclick=()=>{
  alert("Sign-in is optional. You can continue using Zynx AI as a guest.");
};

// Restore previous guest chat.
if(chats.length){
  activeChat=chats[0];
}else{
  newChat();
}
render();

// Check whether the backend is reachable without requiring authentication.
fetch("/api/me",{credentials:"same-origin"})
  .then(r=>r.ok?r.json():null)
  .then(data=>{
    if(data && data.user){
      user={name:data.user.name || data.user.username || "User",guest:false};
      $("userName").textContent=user.name;
      $("userStatus").textContent="Signed-in user";
    }
  })
  .catch(()=>{});
</script>
</body>
</html>
