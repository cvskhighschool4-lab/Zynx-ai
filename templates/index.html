<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Zynx AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-strong: rgba(255, 255, 255, 0.1);
      --accent: #a78bfa;
      --accent-soft: #c4b5fd;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --cloud-1: rgba(167, 139, 250, 0.15);
      --cloud-2: rgba(139, 92, 246, 0.12);
      --cloud-3: rgba(196, 181, 253, 0.1);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      background: #0b0f1a;
      color: var(--text-primary);
      overflow: hidden;
      height: 100dvh;
      width: 100vw;
    }

    .dream-bg {
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(139, 92, 246, 0.18) 0%, transparent 50%),
        radial-gradient(ellipse 70% 50% at 80% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 45%),
        radial-gradient(ellipse 60% 40% at 50% 80%, rgba(167, 139, 250, 0.12) 0%, transparent 50%),
        linear-gradient(160deg, #0b0f1a 0%, #12182b 40%, #0f1424 100%);
      z-index: 0;
    }

    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      animation: float-up linear infinite;
      filter: blur(1px);
    }

    @keyframes float-up {
      0% { transform: translateY(100vh) scale(0.3); opacity: 0; }
      10% { opacity: 0.6; }
      90% { opacity: 0.4; }
      100% { transform: translateY(-20vh) scale(1); opacity: 0; }
    }

    .cloud {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.5;
      animation: drift 40s ease-in-out infinite alternate;
    }

    .cloud-1 { width: 420px; height: 280px; background: var(--cloud-1); top: 10%; left: -5%; animation-duration: 45s; }
    .cloud-2 { width: 380px; height: 260px; background: var(--cloud-2); top: 50%; right: -8%; animation-duration: 55s; animation-delay: -10s; }
    .cloud-3 { width: 300px; height: 200px; background: var(--cloud-3); bottom: 5%; left: 30%; animation-duration: 50s; animation-delay: -20s; }

    @keyframes drift {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, -30px) scale(1.08); }
    }

    /* Startup Sequence */
    #startup {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b0f1a;
      transition: opacity 1.2s ease, visibility 1.2s;
    }

    #startup.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .startup-clouds {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .startup-cloud {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0;
      animation: cloud-in 2.5s ease forwards;
    }

    .sc1 { width: 500px; height: 350px; background: rgba(139, 92, 246, 0.25); top: 15%; left: 10%; animation-delay: 0.2s; }
    .sc2 { width: 450px; height: 300px; background: rgba(99, 102, 241, 0.2); top: 40%; right: 5%; animation-delay: 0.5s; }
    .sc3 { width: 400px; height: 280px; background: rgba(167, 139, 250, 0.18); bottom: 10%; left: 25%; animation-delay: 0.8s; }

    @keyframes cloud-in {
      0% { opacity: 0; transform: scale(0.7) translateY(40px); }
      100% { opacity: 0.7; transform: scale(1) translateY(0); }
    }

    .startup-logo {
      font-family: 'Playfair Display', serif;
      font-size: 3.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #e0e7ff 0%, #c4b5fd 40%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      opacity: 0;
      transform: translateY(20px);
      animation: fade-up 1.2s ease 1.2s forwards;
      position: relative;
      z-index: 2;
    }

    .startup-sub {
      margin-top: 0.75rem;
      font-size: 1rem;
      color: #94a3b8;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0;
      animation: fade-up 1s ease 1.8s forwards;
      position: relative;
      z-index: 2;
    }

    .startup-loader {
      margin-top: 2.5rem;
      width: 120px;
      height: 2px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
      opacity: 0;
      animation: fade-up 0.8s ease 2.2s forwards;
      position: relative;
      z-index: 2;
    }

    .startup-loader-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #a78bfa, #c4b5fd);
      border-radius: 2px;
      animation: load-bar 2.2s ease 2.4s forwards;
    }

    @keyframes fade-up {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes load-bar {
      to { width: 100%; }
    }

    /* App Shell */
    #app {
      position: relative;
      z-index: 10;
      height: 100dvh;
      display: flex;
      opacity: 0;
      transition: opacity 1s ease 0.3s;
    }

    #app.ready {
      opacity: 1;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: rgba(15, 20, 36, 0.55);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), width 0.35s;
      z-index: 30;
    }

    .sidebar.collapsed {
      width: 0;
      transform: translateX(-100%);
      overflow: hidden;
      border: none;
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        transform: translateX(-100%);
        width: 280px;
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .sidebar.collapsed {
        transform: translateX(-100%);
        width: 280px;
      }
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
    }

    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
    }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 1rem 1rem;
      scroll-behavior: smooth;
    }

    .messages-container::-webkit-scrollbar {
      width: 5px;
    }
    .messages-container::-webkit-scrollbar-track {
      background: transparent;
    }
    .messages-container::-webkit-scrollbar-thumb {
      background: rgba(167, 139, 250, 0.3);
      border-radius: 10px;
    }

    .message-row {
      display: flex;
      margin-bottom: 1.25rem;
      animation: msg-in 0.4s ease;
    }

    @keyframes msg-in {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-bubble {
      max-width: min(720px, 88%);
      padding: 0.9rem 1.15rem;
      border-radius: 1.1rem;
      line-height: 1.55;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message-user {
      margin-left: auto;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.35), rgba(99, 102, 241, 0.25));
      border: 1px solid rgba(167, 139, 250, 0.25);
      border-bottom-right-radius: 0.35rem;
    }

    .message-assistant {
      margin-right: auto;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom-left-radius: 0.35rem;
    }

    .input-area {
      padding: 0.75rem 1rem 1.25rem;
      background: linear-gradient(to top, rgba(11, 15, 26, 0.85), transparent);
    }

    .input-glass {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 1.25rem;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .input-glass:focus-within {
      border-color: rgba(167, 139, 250, 0.45);
      box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.12);
    }

    .input-glass textarea {
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: var(--text-primary);
      font-size: 0.95rem;
      line-height: 1.5;
      max-height: 160px;
    }

    .input-glass textarea::placeholder {
      color: #64748b;
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
    }

    .btn-icon.active {
      color: #a78bfa;
      background: rgba(167, 139, 250, 0.15);
    }

    .btn-send {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      border: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-send:hover:not(:disabled) {
      transform: scale(1.06);
      box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
    }

    .btn-send:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .chat-item {
      padding: 0.7rem 0.9rem;
      border-radius: 0.75rem;
      cursor: pointer;
      transition: background 0.2s;
      border: 1px solid transparent;
    }

    .chat-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .chat-item.active {
      background: rgba(167, 139, 250, 0.12);
      border-color: rgba(167, 139, 250, 0.2);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }

    .modal-backdrop.show {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: rgba(20, 25, 42, 0.9);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.25rem;
      width: 100%;
      max-width: 400px;
      padding: 1.75rem;
      transform: translateY(20px) scale(0.97);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .modal-backdrop.show .modal {
      transform: translateY(0) scale(1);
    }

    .settings-panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 320px;
      max-width: 90vw;
      background: rgba(15, 20, 36, 0.85);
      backdrop-filter: blur(28px);
      border-left: 1px solid var(--glass-border);
      z-index: 40;
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
    }

    .settings-panel.open {
      transform: translateX(0);
    }

    .typing-dots span {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #a78bfa;
      margin: 0 2px;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
      40% { transform: translateY(-6px); opacity: 1; }
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      padding: 2rem;
      opacity: 0.85;
    }

    .empty-state h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.75rem;
      background: linear-gradient(135deg, #e0e7ff, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.12);
      border-radius: 4px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #a78bfa;
      cursor: pointer;
      border: 2px solid #1e1b4b;
    }

    .overlay-mobile {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 25;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }
    .overlay-mobile.show {
      opacity: 1;
      visibility: visible;
    }
  </style>
</head>
<body>
  <!-- Startup Sequence -->
  <div id="startup">
    <div class="startup-clouds">
      <div class="startup-cloud sc1"></div>
      <div class="startup-cloud sc2"></div>
      <div class="startup-cloud sc3"></div>
    </div>
    <div class="startup-logo">Zynx AI</div>
    <div class="startup-sub">Dream • Think • Create</div>
    <div class="startup-loader"><div class="startup-loader-bar"></div></div>
  </div>

  <!-- Background -->
  <div class="dream-bg"></div>
  <div class="particles" id="particles"></div>
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="cloud cloud-3"></div>

  <!-- Mobile overlay -->
  <div class="overlay-mobile" id="mobileOverlay"></div>

  <!-- App -->
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="p-4 flex items-center justify-between border-b border-white/10">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-full bg-gradient-to-br from-violet-500 to-indigo-500 flex items-center justify-center text-sm font-semibold">Z</div>
          <span class="font-semibold tracking-tight">Zynx</span>
        </div>
        <button class="btn-icon md:hidden" id="closeSidebar" aria-label="Close sidebar">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="p-3">
        <button id="newChatBtn" class="w-full flex items-center gap-2 px-3 py-2.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 transition text-sm font-medium">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg>
          New Chat
        </button>
      </div>

      <div class="flex-1 overflow-y-auto px-2 pb-2 space-y-0.5" id="chatList">
        <!-- chats injected here -->
      </div>

      <div class="p-3 border-t border-white/10 space-y-1">
        <button id="settingsBtn" class="w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl hover:bg-white/5 transition text-sm text-slate-300">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          Settings
        </button>
        <button id="authBtn" class="w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl hover:bg-white/5 transition text-sm text-slate-300">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          <span id="authBtnLabel">Sign In</span>
        </button>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="chat-area">
      <header class="flex items-center justify-between px-4 py-3 border-b border-white/5">
        <div class="flex items-center gap-3">
          <button class="btn-icon" id="toggleSidebar" aria-label="Toggle sidebar">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <h1 class="text-sm font-medium text-slate-300 truncate max-w-[200px]" id="currentChatTitle">New Chat</h1>
        </div>
        <div class="text-xs text-slate-500" id="userBadge">Guest</div>
      </header>

      <div class="messages-container" id="messages">
        <div class="empty-state" id="emptyState">
          <h2>Hello, dreamer</h2>
          <p class="text-slate-400 text-sm max-w-sm">I'm Zynx — your thoughtful companion. Ask me anything, or just say hi.</p>
        </div>
      </div>

      <div class="input-area">
        <div class="input-glass flex items-end gap-2 px-3 py-2 max-w-3xl mx-auto">
          <button class="btn-icon shrink-0" id="voiceBtn" title="Voice input" aria-label="Voice input">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/></svg>
          </button>
          <textarea id="messageInput" rows="1" placeholder="Message Zynx..." class="flex-1 py-2 px-1"></textarea>
          <button class="btn-send shrink-0" id="sendBtn" disabled aria-label="Send">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </div>
        <p class="text-center text-[11px] text-slate-600 mt-2">Zynx can make mistakes. Founded by Amogh.</p>
      </div>
    </main>
  </div>

  <!-- Settings Panel -->
  <div class="settings-panel" id="settingsPanel">
    <div class="p-4 flex items-center justify-between border-b border-white/10">
      <h2 class="font-semibold">Settings</h2>
      <button class="btn-icon" id="closeSettings">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="flex-1 overflow-y-auto p-5 space-y-6">
      <div>
        <label class="text-sm text-slate-400 mb-2 block">Theme Intensity</label>
        <input type="range" id="themeIntensity" min="0" max="1" step="0.05" value="0.7">
        <div class="flex justify-between text-xs text-slate-500 mt-1"><span>Soft</span><span>Vivid</span></div>
      </div>
      <div>
        <label class="text-sm text-slate-400 mb-2 block">Humor Level</label>
        <input type="range" id="humorLevel" min="0" max="1" step="0.05" value="0.6">
        <div class="flex justify-between text-xs text-slate-500 mt-1"><span>Serious</span><span>Playful</span></div>
      </div>
      <div>
        <label class="text-sm text-slate-400 mb-2 block">Response Length</label>
        <div class="flex gap-2">
          <button class="flex-1 py-2 rounded-lg text-sm border border-white/10 hover:bg-white/5 transition length-btn" data-value="concise">Concise</button>
          <button class="flex-1 py-2 rounded-lg text-sm border border-white/10 hover:bg-white/5 transition length-btn active bg-violet-500/20 border-violet-400/30" data-value="balanced">Balanced</button>
          <button class="flex-1 py-2 rounded-lg text-sm border border-white/10 hover:bg-white/5 transition length-btn" data-value="detailed">Detailed</button>
        </div>
      </div>
      <div>
        <label class="text-sm text-slate-400 mb-2 block">Response Style</label>
        <div class="grid grid-cols-2 gap-2">
          <button class="py-2 rounded-lg text-sm border border-white/10 hover:bg-white/5 transition style-btn active bg-violet-500/20 border-violet-400/30" data-value="warm">Warm</button>
          <button class="py-2 rounded-lg text-sm border border-white/10 hover:bg-white/5 transition style-btn" data-value="professional">Professional</button>
          <button class="py-2 rounded-lg text-sm border border-white/10 hover:bg-white/5 transition style-btn" data-value="playful">Playful</button>
          <button class="py-2 rounded-lg text-sm border border-white/10 hover:bg-white/5 transition style-btn" data-value="poetic">Poetic</button>
        </div>
      </div>
      <button id="saveSettings" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-violet-600 to-indigo-600 text-sm font-medium hover:opacity-90 transition">Save Preferences</button>
    </div>
  </div>

  <!-- Auth Modal -->
  <div class="modal-backdrop" id="authModal">
    <div class="modal">
      <div class="flex justify-between items-center mb-5">
        <h2 class="text-lg font-semibold" id="authTitle">Sign In</h2>
        <button class="btn-icon" id="closeAuth">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="authForm" class="space-y-4">
        <div>
          <label class="text-xs text-slate-400 mb-1.5 block">Username</label>
          <input type="text" id="authUsername" required minlength="3" maxlength="32" class="w-full px-3 py-2.5 rounded-xl bg-white/5 border border-white/10 outline-none focus:border-violet-400/50 text-sm" placeholder="yourname">
        </div>
        <div>
          <label class="text-xs text-slate-400 mb-1.5 block">Password</label>
          <input type="password" id="authPassword" required minlength="6" class="w-full px-3 py-2.5 rounded-xl bg-white/5 border border-white/10 outline-none focus:border-violet-400/50 text-sm" placeholder="••••••••">
        </div>
        <p class="text-xs text-red-400 hidden" id="authError"></p>
        <button type="submit" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-violet-600 to-indigo-600 text-sm font-medium hover:opacity-90 transition" id="authSubmit">Sign In</button>
      </form>
      <p class="text-center text-xs text-slate-500 mt-4">
        <span id="authToggleText">Don't have an account?</span>
        <button class="text-violet-400 hover:underline ml-1" id="authToggle">Sign Up</button>
      </p>
    </div>
  </div>

  <script>
    // ============ State ============
    const state = {
      sessionId: localStorage.getItem('zynx_session') || null,
      user: null,
      chats: [],
      currentChatId: null,
      messages: [],
      isSending: false,
      isListening: false,
      settings: {
        theme_intensity: 0.7,
        humor_level: 0.6,
        response_length: 'balanced',
        response_style: 'warm'
      },
      authMode: 'signin' // or 'signup'
    };

    // ============ DOM ============
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);

    const startup = $('#startup');
    const app = $('#app');
    const sidebar = $('#sidebar');
    const messagesEl = $('#messages');
    const emptyState = $('#emptyState');
    const messageInput = $('#messageInput');
    const sendBtn = $('#sendBtn');
    const voiceBtn = $('#voiceBtn');
    const chatList = $('#chatList');
    const currentChatTitle = $('#currentChatTitle');
    const userBadge = $('#userBadge');
    const authBtnLabel = $('#authBtnLabel');
    const settingsPanel = $('#settingsPanel');
    const authModal = $('#authModal');
    const mobileOverlay = $('#mobileOverlay');

    // ============ Particles ============
    function createParticles() {
      const container = $('#particles');
      for (let i = 0; i < 28; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 3 + 1;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (Math.random() * 18 + 14) + 's';
        p.style.animationDelay = (Math.random() * 12) + 's';
        p.style.opacity = Math.random() * 0.5 + 0.15;
        container.appendChild(p);
      }
    }

    // ============ API Helpers ============
    async function api(path, options = {}) {
      const headers = {
        'Content-Type': 'application/json',
        ...(options.headers || {})
      };
      if (state.sessionId) headers['X-Session-ID'] = state.sessionId;

      const res = await fetch(path, {
        ...options,
        headers,
        body: options.body ? JSON.stringify(options.body) : undefined
      });

      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    // ============ Session ============
    async function initSession() {
      try {
        const data = await api('/api/session', { method: 'POST', body: { session_id: state.sessionId } });
        state.sessionId = data.session_id;
        localStorage.setItem('zynx_session', state.sessionId);
        await refreshMe();
        await loadChats();
        await loadSettings();
      } catch (e) {
        console.error('Session init failed', e);
      }
    }

    async function refreshMe() {
      try {
        const data = await api('/api/me');
        state.user = data.user;
        userBadge.textContent = data.user ? data.user.username : 'Guest';
        authBtnLabel.textContent = data.user ? 'Account' : 'Sign In';
      } catch (e) {}
    }

    // ============ Chats ============
    async function loadChats() {
      try {
        const data = await api('/api/chats');
        state.chats = data.chats || [];
        renderChatList();
      } catch (e) {}
    }

    function renderChatList() {
      chatList.innerHTML = '';
      if (state.chats.length === 0) {
        chatList.innerHTML = '<p class="text-xs text-slate-500 px-3 py-2">No chats yet</p>';
        return;
      }
      state.chats.forEach(chat => {
        const el = document.createElement('div');
        el.className = 'chat-item group flex items-center justify-between ' + (chat.id === state.currentChatId ? 'active' : '');
        el.innerHTML = `
          <span class="truncate text-sm flex-1">${escapeHtml(chat.title || 'New Chat')}</span>
          <button class="opacity-0 group-hover:opacity-100 btn-icon !w-7 !h-7 delete-chat" data-id="${chat.id}" title="Delete">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>
          </button>
        `;
        el.addEventListener('click', (e) => {
          if (e.target.closest('.delete-chat')) return;
          openChat(chat.id);
        });
        el.querySelector('.delete-chat')?.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (!confirm('Delete this chat?')) return;
          try {
            await api(`/api/chats/${chat.id}`, { method: 'DELETE' });
            if (state.currentChatId === chat.id) {
              state.currentChatId = null;
              state.messages = [];
              renderMessages();
              currentChatTitle.textContent = 'New Chat';
            }
            await loadChats();
          } catch (err) {}
        });
        chatList.appendChild(el);
      });
    }

    async function createNewChat() {
      try {
        const data = await api('/api/chats', { method: 'POST', body: { title: 'New Chat' } });
        state.currentChatId = data.id;
        state.messages = [];
        currentChatTitle.textContent = 'New Chat';
        await loadChats();
        renderMessages();
        messageInput.focus();
        closeSidebarMobile();
      } catch (e) {
        console.error(e);
      }
    }

    async function openChat(chatId) {
      try {
        const data = await api(`/api/chats/${chatId}`);
        state.currentChatId = chatId;
        state.messages = data.messages || [];
        currentChatTitle.textContent = data.chat.title || 'Chat';
        renderMessages();
        renderChatList();
        closeSidebarMobile();
      } catch (e) {}
    }

    // ============ Messages ============
    function renderMessages() {
      if (state.messages.length === 0) {
        emptyState.style.display = 'flex';
        messagesEl.querySelectorAll('.message-row').forEach(el => el.remove());
        return;
      }
      emptyState.style.display = 'none';
      const existing = messagesEl.querySelectorAll('.message-row, .typing-indicator');
      existing.forEach(el => el.remove());

      state.messages.forEach(msg => {
        const row = document.createElement('div');
        row.className = 'message-row';
        const bubble = document.createElement('div');
        bubble.className = 'message-bubble ' + (msg.role === 'user' ? 'message-user' : 'message-assistant');
        bubble.textContent = msg.content;
        row.appendChild(bubble);
        messagesEl.appendChild(row);
      });
      scrollToBottom();
    }

    function appendMessage(role, content) {
      emptyState.style.display = 'none';
      const row = document.createElement('div');
      row.className = 'message-row';
      const bubble = document.createElement('div');
      bubble.className = 'message-bubble ' + (role === 'user' ? 'message-user' : 'message-assistant');
      bubble.textContent = content;
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      scrollToBottom();
      return row;
    }

    function showTyping() {
      const row = document.createElement('div');
      row.className = 'message-row typing-indicator';
      row.innerHTML = `<div class="message-bubble message-assistant"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
      messagesEl.appendChild(row);
      scrollToBottom();
      return row;
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      });
    }

    async function sendMessage() {
      const content = messageInput.value.trim();
      if (!content || state.isSending) return;

      if (!state.currentChatId) {
        await createNewChat();
      }

      state.isSending = true;
      sendBtn.disabled = true;
      messageInput.value = '';
      autoResize();

      appendMessage('user', content);
      state.messages.push({ role: 'user', content });
      const typing = showTyping();

      try {
        const data = await api(`/api/chats/${state.currentChatId}/messages`, {
          method: 'POST',
          body: { content }
        });
        typing.remove();
        appendMessage('assistant', data.assistant_message.content);
        state.messages.push(data.assistant_message);
        await loadChats();
        currentChatTitle.textContent = state.chats.find(c => c.id === state.currentChatId)?.title || 'Chat';
      } catch (e) {
        typing.remove();
        appendMessage('assistant', "Hmm, something went wrong. Mind trying again?");
      } finally {
        state.isSending = false;
        sendBtn.disabled = messageInput.value.trim().length === 0;
        messageInput.focus();
      }
    }

    // ============ Settings ============
    async function loadSettings() {
      try {
        const data = await api('/api/settings');
        state.settings = data;
        $('#themeIntensity').value = data.theme_intensity;
        $('#humorLevel').value = data.humor_level;
        $$('.length-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.value === data.response_length);
          btn.classList.toggle('bg-violet-500/20', btn.dataset.value === data.response_length);
          btn.classList.toggle('border-violet-400/30', btn.dataset.value === data.response_length);
        });
        $$('.style-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.value === data.response_style);
          btn.classList.toggle('bg-violet-500/20', btn.dataset.value === data.response_style);
          btn.classList.toggle('border-violet-400/30', btn.dataset.value === data.response_style);
        });
        applyThemeIntensity(data.theme_intensity);
      } catch (e) {}
    }

    function applyThemeIntensity(val) {
      document.documentElement.style.setProperty('--cloud-1', `rgba(167, 139, 250, ${0.08 + val * 0.12})`);
      document.documentElement.style.setProperty('--cloud-2', `rgba(139, 92, 246, ${0.06 + val * 0.1})`);
      document.documentElement.style.setProperty('--cloud-3', `rgba(196, 181, 253, ${0.05 + val * 0.1})`);
    }

    async function saveSettings() {
      const payload = {
        theme_intensity: parseFloat($('#themeIntensity').value),
        humor_level: parseFloat($('#humorLevel').value),
        response_length: document.querySelector('.length-btn.active')?.dataset.value || 'balanced',
        response_style: document.querySelector('.style-btn.active')?.dataset.value || 'warm'
      };
      try {
        const data = await api('/api/settings', { method: 'PUT', body: payload });
        state.settings = data;
        applyThemeIntensity(data.theme_intensity);
        settingsPanel.classList.remove('open');
      } catch (e) {}
    }

    // ============ Auth ============
    function openAuth(mode = 'signin') {
      state.authMode = mode;
      $('#authTitle').textContent = mode === 'signin' ? 'Sign In' : 'Create Account';
      $('#authSubmit').textContent = mode === 'signin' ? 'Sign In' : 'Sign Up';
      $('#authToggleText').textContent = mode === 'signin' ? "Don't have an account?" : 'Already have an account?';
      $('#authToggle').textContent = mode === 'signin' ? 'Sign Up' : 'Sign In';
      $('#authError').classList.add('hidden');
      $('#authForm').reset();
      authModal.classList.add('show');
    }

    async function handleAuth(e) {
      e.preventDefault();
      const username = $('#authUsername').value.trim();
      const password = $('#authPassword').value;
      const errorEl = $('#authError');
      errorEl.classList.add('hidden');

      try {
        const endpoint = state.authMode === 'signin' ? '/api/signin' : '/api/signup';
        const data = await api(endpoint, { method: 'POST', body: { username, password } });
        state.sessionId = data.session_id;
        localStorage.setItem('zynx_session', state.sessionId);
        state.user = data.user;
        userBadge.textContent = data.user.username;
        authBtnLabel.textContent = 'Account';
        authModal.classList.remove('show');
        await loadChats();
        state.currentChatId = null;
        state.messages = [];
        renderMessages();
        currentChatTitle.textContent = 'New Chat';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
      }
    }

    // ============ Voice ============
    let recognition = null;
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        messageInput.value = transcript;
        autoResize();
        sendBtn.disabled = !transcript.trim();
      };

      recognition.onend = () => {
        state.isListening = false;
        voiceBtn.classList.remove('active');
      };

      recognition.onerror = () => {
        state.isListening = false;
        voiceBtn.classList.remove('active');
      };
    }

    function toggleVoice() {
      if (!recognition) {
        alert('Voice input is not supported in this browser.');
        return;
      }
      if (state.isListening) {
        recognition.stop();
        return;
      }
      state.isListening = true;
      voiceBtn.classList.add('active');
      recognition.start();
    }

    // ============ UI Helpers ============
    function autoResize() {
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 160) + 'px';
      sendBtn.disabled = !messageInput.value.trim() || state.isSending;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function closeSidebarMobile() {
      sidebar.classList.remove('open');
      mobileOverlay.classList.remove('show');
    }

    // ============ Events ============
    messageInput.addEventListener('input', autoResize);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    sendBtn.addEventListener('click', sendMessage);
    voiceBtn.addEventListener('click', toggleVoice);
    $('#newChatBtn').addEventListener('click', createNewChat);

    $('#toggleSidebar').addEventListener('click', () => {
      if (window.innerWidth <= 768) {
        sidebar.classList.toggle('open');
        mobileOverlay.classList.toggle('show');
      } else {
        sidebar.classList.toggle('collapsed');
      }
    });
    $('#closeSidebar').addEventListener('click', closeSidebarMobile);
    mobileOverlay.addEventListener('click', closeSidebarMobile);

    $('#settingsBtn').addEventListener('click', () => {
      settingsPanel.classList.add('open');
      closeSidebarMobile();
    });
    $('#closeSettings').addEventListener('click', () => settingsPanel.classList.remove('open'));
    $('#saveSettings').addEventListener('click', saveSettings);

    $$('.length-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        $$('.length-btn').forEach(b => {
          b.classList.remove('active', 'bg-violet-500/20', 'border-violet-400/30');
        });
        btn.classList.add('active', 'bg-violet-500/20', 'border-violet-400/30');
      });
    });
    $$('.style-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        $$('.style-btn').forEach(b => {
          b.classList.remove('active', 'bg-violet-500/20', 'border-violet-400/30');
        });
        btn.classList.add('active', 'bg-violet-500/20', 'border-violet-400/30');
      });
    });

    $('#themeIntensity').addEventListener('input', (e) => {
      applyThemeIntensity(parseFloat(e.target.value));
    });

    $('#authBtn').addEventListener('click', () => {
      if (state.user) {
        // Simple logout by creating new guest session
        localStorage.removeItem('zynx_session');
        state.sessionId = null;
        state.user = null;
        initSession().then(() => {
          state.currentChatId = null;
          state.messages = [];
          renderMessages();
          currentChatTitle.textContent = 'New Chat';
        });
      } else {
        openAuth('signin');
      }
    });
    $('#closeAuth').addEventListener('click', () => authModal.classList.remove('show'));
    $('#authToggle').addEventListener('click', () => {
      openAuth(state.authMode === 'signin' ? 'signup' : 'signin');
    });
    $('#authForm').addEventListener('submit', handleAuth);

    // ============ Boot ============
    createParticles();

    setTimeout(() => {
      startup.classList.add('hidden');
      app.classList.add('ready');
      initSession();
    }, 4200);
  </script>
</body>
</html>
