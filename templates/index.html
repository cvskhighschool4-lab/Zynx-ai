<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zynx AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* Dreamy Purple Animated Background */
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 15% 20%, #3b1d6e 0%, #16092b 45%, #090314 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #f3e8ff;
            position: relative;
        }

        /* Floating Dreamy Light Orbs Behind the Glass */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            animation: float 10s infinite ease-in-out alternate;
        }

        .orb-1 {
            width: 380px;
            height: 380px;
            background: rgba(168, 85, 247, 0.45);
            top: -80px;
            left: 10%;
        }

        .orb-2 {
            width: 320px;
            height: 320px;
            background: rgba(236, 72, 153, 0.35);
            bottom: -60px;
            right: 12%;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 220px;
            height: 220px;
            background: rgba(99, 102, 241, 0.4);
            top: 45%;
            left: 55%;
            animation-duration: 14s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -40px) scale(1.1); }
        }

        /* Main Glassmorphism Chat Container */
        .glass-container {
            position: relative;
            z-index: 1;
            width: 92%;
            max-width: 820px;
            height: 86vh;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-top: 1px solid rgba(255, 255, 255, 0.32);
            border-left: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6),
                        inset 0 0 20px rgba(192, 132, 252, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Translucent Header */
        .chat-header {
            padding: 20px 28px;
            background: rgba(255, 255, 255, 0.04);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e879f9, #8b5cf6);
            box-shadow: 0 0 12px #d946ef;
        }

        .brand h1 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #ffffff, #d8b4fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .dev-badge {
            font-size: 0.75rem;
            padding: 5px 12px;
            border-radius: 999px;
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(216, 180, 254, 0.3);
            color: #e9d5ff;
            letter-spacing: 0.4px;
        }

        /* Chat Messages Area */
        .chat-box {
            flex: 1;
            padding: 24px 28px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        /* Custom Glass Scrollbar */
        .chat-box::-webkit-scrollbar {
            width: 6px;
        }
        .chat-box::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        /* Message Bubbles */
        .message {
            max-width: 78%;
            padding: 14px 18px;
            border-radius: 20px;
            line-height: 1.55;
            font-size: 0.96rem;
            word-wrap: break-word;
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.75), rgba(192, 38, 211, 0.65));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(240, 171, 252, 0.35);
            color: #ffffff;
            border-bottom-right-radius: 6px;
            box-shadow: 0 8px 20px rgba(126, 34, 206, 0.25);
        }

        .bot-message {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.09);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #f3e8ff;
            border-bottom-left-radius: 6px;
        }

        /* Frosted Input Bar */
        .input-area {
            padding: 18px 24px;
            background: rgba(15, 7, 32, 0.35);
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            font-size: 0.96rem;
            outline: none;
            transition: all 0.25s ease;
        }

        input[type="text"]::placeholder {
            color: rgba(233, 213, 255, 0.55);
        }

        input[type="text"]:focus {
            background: rgba(255, 255, 255, 0.13);
            border-color: rgba(216, 180, 254, 0.6);
            box-shadow: 0 0 18px rgba(168, 85, 247, 0.25);
        }

        button {
            padding: 14px 24px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: linear-gradient(135deg, #9333ea, #c026d3);
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 22px rgba(192, 38, 211, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }

        /* Typing indicator */
        .typing {
            font-style: italic;
            color: #d8b4fe;
            font-size: 0.88rem;
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <!-- Ambient Dreamy Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Main Frosted Glass Interface -->
    <div class="glass-container">
        <div class="chat-header">
            <div class="brand">
                <div class="brand-dot"></div>
                <h1>Zynx AI</h1>
            </div>
            <span class="dev-badge">Dev Access</span>
        </div>

        <div class="chat-box" id="chat-box">
            <div class="message bot-message">
                Hello! I'm Zynx AI. How can I help you today?
            </div>
        </div>

        <form class="input-area" id="chat-form">
            <input type="text" id="user-input" placeholder="Ask Zynx AI anything..." autocomplete="off" required>
            <button type="submit">Send</button>
        </form>
    </div>

    <script>
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.textContent = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage(message, 'user-message');
            userInput.value = '';

            const loadingMsg = appendMessage('Zynx is thinking...', 'bot-message typing');

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                loadingMsg.remove();
                appendMessage(data.reply || 'No response received.', 'bot-message');
            } catch (error) {
                loadingMsg.remove();
                appendMessage('Connection error. Please try again.', 'bot-message');
            }
        });
    </script>
</body>
</html>
