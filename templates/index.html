<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zynx AI</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#080706; --panel:rgba(18,16,13,.72); --line:rgba(201,162,75,.18); --line-strong:rgba(201,162,75,.4);
  --gold:#c9a24b; --gold-soft:#e8cf8e; --ivory:#f1ece0; --muted:rgba(241,236,224,.55); --danger:#e58a7a;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Plus Jakarta Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);color:var(--ivory);background:var(--ink);overflow:hidden;
  background-image:
    radial-gradient(ellipse 60% 50% at 10% 0%,rgba(201,162,75,.16),transparent 70%),
    radial-gradient(ellipse 50% 50% at 95% 100%,rgba(160,110,20,.16),transparent 70%);
}
.veins{position:fixed;inset:0;width:100%;height:100%;opacity:.28;pointer-events:none}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-soft);outline-offset:2px}
.hidden{display:none!important}

/* ---------- Auth ---------- */
.auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
.auth-card{
  width:100%;max-width:420px;padding:40px 36px 32px;border-radius:24px;
  background:var(--panel);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid var(--line);border-top-color:var(--line-strong);
  box-shadow:0 40px 80px rgba(0,0,0,.7);
}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.logo i{width:16px;height:16px;border-radius:4px;transform:rotate(45deg);background:linear-gradient(135deg,var(--gold-soft),var(--gold) 55%,#7a5614);box-shadow:0 0 18px rgba(201,162,75,.5)}
.logo span{font-family:var(--serif);font-size:1.7rem;font-weight:600;letter-spacing:.02em;color:var(--gold-soft)}
.auth h2{font-family:var(--serif);font-weight:500;font-size:2rem;line-height:1.15;margin-bottom:6px}
.auth .sub{color:var(--muted);font-size:.9rem;margin-bottom:24px}
.tabs{display:flex;padding:4px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);margin-bottom:22px}
.tab{flex:1;padding:9px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:600;font-size:.88rem;cursor:pointer;transition:background .2s,color .2s}
.tab[aria-selected="true"]{background:rgba(201,162,75,.16);color:var(--gold-soft)}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:15px}
.field label{font-size:.82rem;color:var(--muted);font-weight:500}
.field input{padding:13px 14px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--line);outline:none;transition:border-color .2s,box-shadow .2s}
.field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,75,.15)}
.err{min-height:20px;font-size:.84rem;color:var(--danger);margin:-2px 0 10px}
.btn{width:100%;padding:13px;border-radius:12px;border:0;cursor:pointer;font-weight:700;font-size:.93rem;color:#150f03;background:linear-gradient(135deg,var(--gold-soft),var(--gold));transition:transform .15s,box-shadow .2s,opacity .2s}
.btn:hover{box-shadow:0 8px 26px rgba(201,162,75,.35);transform:translateY(-1px)}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
.switch{margin-top:20px;text-align:center;font-size:.86rem;color:var(--muted)}
.switch button{background:none;border:0;color:var(--gold-soft);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ---------- App ---------- */
.app{position:fixed;inset:0;display:flex;padding:18px;gap:14px;z-index:1}
.sidebar,.chat{background:var(--panel);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 60px rgba(0,0,0,.6)}
.sidebar{width:264px;display:flex;flex-direction:column;padding:22px 16px 16px}
.sidebar .logo{margin:0 6px 22px}
.new{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line-strong);background:rgba(201,162,75,.1);color:var(--gold-soft);font-weight:600;font-size:.88rem;cursor:pointer;transition:background .2s}
.new:hover{background:rgba(201,162,75,.2)}
.label{margin:22px 8px 8px;font-size:.78rem;color:var(--muted);font-weight:600}
.sessions{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.session{padding:10px 12px;border-radius:10px;font-size:.86rem;color:rgba(241,236,224,.75);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid transparent;background:none;text-align:left;width:100%}
.session:hover{background:rgba(255,255,255,.04)}
.session.active{background:rgba(201,162,75,.1);border-color:var(--line)}
.profile{display:flex;align-items:center;gap:11px;padding:12px 8px 0;margin-top:12px;border-top:1px solid var(--line)}
.avatar{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem;color:#150f03;background:linear-gradient(135deg,var(--gold-soft),var(--gold))}
.who{flex:1;min-width:0}
.who b{display:block;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--muted);font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.out{background:none;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:.78rem;color:var(--muted);cursor:pointer;transition:color .2s,border-color .2s}
.out:hover{color:var(--gold-soft);border-color:var(--line-strong)}

.chat{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.head{display:flex;align-items:center;justify-content:space-between;padding:16px 26px;border-bottom:1px solid var(--line)}
.head h3{font-size:.95rem;font-weight:600}
.pill{font-size:.78rem;color:var(--gold-soft);padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(201,162,75,.08)}
.msgs{flex:1;overflow-y:auto;padding:28px 0;scroll-behavior:smooth}
.msgs::-webkit-scrollbar,.sessions::-webkit-scrollbar{width:5px}
.msgs::-webkit-scrollbar-thumb,.sessions::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:9px}
.col{max-width:760px;margin:0 auto;padding:0 26px;display:flex;flex-direction:column;gap:20px}
.hello{text-align:center;padding:9vh 0 4vh}
.hello h1{font-family:var(--serif);font-weight:500;font-size:clamp(2rem,4.5vw,3rem);line-height:1.1;margin-bottom:10px}
.hello p{color:var(--muted);font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:26px}
.chip{padding:10px 16px;border-radius:999px;font-size:.84rem;background:rgba(255,255,255,.03);border:1px solid var(--line);cursor:pointer;transition:border-color .2s,background .2s}
.chip:hover{border-color:var(--line-strong);background:rgba(201,162,75,.08)}
.msg{display:flex;gap:14px;animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg .av{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;font-size:.74rem;font-weight:700}
.msg.bot .av{border:1px solid var(--line-strong);background:rgba(201,162,75,.1);color:var(--gold-soft)}
.msg.bot .av i{width:9px;height:9px;transform:rotate(45deg);background:linear-gradient(135deg,var(--gold-soft),var(--gold));border-radius:2px}
.msg.user{flex-direction:row-reverse}
.msg.user .av{background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:#150f03}
.bubble{padding:12px 16px;border-radius:16px;line-height:1.65;font-size:.94rem;max-width:calc(100% - 50px);white-space:pre-wrap;word-wrap:break-word}
.msg.bot .bubble{background:rgba(255,255,255,.035);border:1px solid var(--line);border-top-left-radius:5px}
.msg.user .bubble{background:rgba(201,162,75,.16);border:1px solid var(--line-strong);border-top-right-radius:5px}
.dots{display:inline-flex;gap:5px;padding:6px 2px}
.dots span{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:b 1.1s infinite ease-in-out}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

.composer{padding:6px 26px 22px}
.composer form{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 20px;border-radius:18px;background:rgba(0,0,0,.4);border:1px solid var(--line-strong);transition:border-color .2s,box-shadow .2s}
.composer form:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,75,.12)}
.composer input{flex:1;background:none;border:0;outline:none;padding:10px 0;font-size:.95rem}
.composer input::placeholder{color:rgba(232,207,142,.4)}
.send{width:42px;height:42px;border:0;border-radius:12px;cursor:pointer;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold-soft),var(--gold));transition:transform .15s,box-shadow .2s}
.send:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(201,162,75,.4)}
.send svg{width:18px;height:18px;stroke:#150f03;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.note{text-align:center;font-size:.74rem;color:var(--muted);margin-top:10px}

@media (max-width:760px){
  .sidebar{display:none}.app{padding:8px}.head{padding:14px 18px}
  .col,.composer{padding-left:16px;padding-right:16px}.auth-card{padding:32px 24px 26px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg class="veins" viewBox="0 0 1440 900" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9a24b" stop-opacity=".05"/><stop offset=".5" stop-color="#e8cf8e" stop-opacity=".6"/><stop offset="1" stop-color="#7a5614" stop-opacity=".05"/></linearGradient>
  </defs>
  <path d="M-50,180 C240,290 420,90 740,240 C1060,390 1220,140 1500,260" fill="none" stroke="url(#g1)" stroke-width="1.6"/>
  <path d="M-40,620 C310,490 580,740 910,560 C1180,410 1320,630 1510,540" fill="none" stroke="url(#g1)" stroke-width="1.2"/>
</svg>

<!-- Auth -->
<section class="auth" id="auth">
  <div class="auth-card">
    <div class="logo"><i></i><span>Zynx AI</span></div>
    <h2 id="auth-title">Welcome back</h2>
    <p class="sub" id="auth-sub">Sign in to continue your conversations.</p>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-in" aria-selected="true" type="button">Sign in</button>
      <button class="tab" role="tab" id="tab-up" aria-selected="false" type="button">Sign up</button>
    </div>
    <form id="auth-form" novalidate>
      <div class="field hidden" id="name-field"><label for="name">Full name</label><input id="name" type="text" autocomplete="name" placeholder="Ada Lovelace"></div>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="At least 8 characters"></div>
      <div class="err" id="err" role="alert"></div>
      <button class="btn" id="auth-btn" type="submit">Sign in</button>
    </form>
    <p class="switch" id="switch">New to Zynx? <button type="button" id="switch-btn">Create an account</button></p>
  </div>
</section>

<!-- App -->
<div class="app hidden" id="app">
  <aside class="sidebar">
    <div class="logo"><i></i><span>Zynx AI</span></div>
    <button class="new" id="new-chat" type="button"><span>New chat</span><span>+</span></button>
    <div class="label">Recent</div>
    <div class="sessions" id="sessions"></div>
    <div class="profile">
      <div class="avatar" id="avatar">Z</div>
      <div class="who"><b id="uname">User</b><small id="umail"></small></div>
      <button class="out" id="signout" type="button">Sign out</button>
    </div>
  </aside>
  <main class="chat">
    <div class="head"><h3 id="chat-title">New chat</h3><span class="pill">Zynx Engine · Groq</span></div>
    <div class="msgs" id="msgs"><div class="col" id="col"></div></div>
    <div class="composer">
      <form id="chat-form" autocomplete="off">
        <input id="user-input" type="text" placeholder="Message Zynx AI" aria-label="Message" required>
        <button class="send" type="submit" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </form>
      <p class="note">Zynx can make mistakes. Check important information.</p>
    </div>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

/* ---------- Auth ---------- */
let mode = 'in', user = store.get('zynx_session', null);

function setMode(m){
  mode = m;
  const up = m === 'up';
  $('tab-in').setAttribute('aria-selected', !up);
  $('tab-up').setAttribute('aria-selected', up);
  $('name-field').classList.toggle('hidden', !up);
  $('auth-title').textContent = up ? 'Create your account' : 'Welcome back';
  $('auth-sub').textContent = up ? 'Start chatting with Zynx in under a minute.' : 'Sign in to continue your conversations.';
  $('auth-btn').textContent = up ? 'Create account' : 'Sign in';
  $('password').autocomplete = up ? 'new-password' : 'current-password';
  $('switch').firstChild.textContent = up ? 'Already have an account? ' : 'New to Zynx? ';
  $('switch-btn').textContent = up ? 'Sign in' : 'Create an account';
  $('err').textContent = '';
}
$('tab-in').onclick = () => setMode('in');
$('tab-up').onclick = () => setMode('up');
$('switch-btn').onclick = () => setMode(mode === 'in' ? 'up' : 'in');

async function hash(s){
  try {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  } catch { return btoa(unescape(encodeURIComponent(s))); }
}

/* Tries your backend (/api/signup, /api/login). If those routes don't exist yet, falls back to browser-only demo accounts. */
async function authRequest(path, body){
  try {
    const r = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    if (r.status === 404 || r.status === 405) return { local:true };
    const data = await r.json().catch(() => ({}));
    return { ok:r.ok, data };
  } catch { return { local:true }; }
}

$('auth-form').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('name').value.trim(), email = $('email').value.trim().toLowerCase(), pw = $('password').value;
  const err = m => { $('err').textContent = m; };
  err('');
  if (mode === 'up' && name.length < 2) return err('Enter your full name.');
  if (!/^\S+@\S+\.\S+$/.test(email)) return err('Enter a valid email address.');
  if (pw.length < 8) return err('Password must be at least 8 characters.');

  const btn = $('auth-btn'); btn.disabled = true;
  const res = await authRequest(mode === 'up' ? '/api/signup' : '/api/login', { name, email, password: pw });
  let session = null;

  if (res.local) {
    const users = store.get('zynx_users', {}), h = await hash(pw);
    if (mode === 'up') {
      if (users[email]) { btn.disabled = false; return err('An account with this email already exists. Sign in instead.'); }
      users[email] = { name, h }; store.set('zynx_users', users);
      session = { name, email };
    } else {
      const u = users[email];
      if (!u || u.h !== h) { btn.disabled = false; return err('Email or password is incorrect.'); }
      session = { name: u.name, email };
    }
  } else if (res.ok) {
    session = { name: res.data.name || name || email.split('@')[0], email };
  } else {
    btn.disabled = false;
    return err(res.data.error || res.data.message || 'Something went wrong. Try again.');
  }
  btn.disabled = false;
  user = session; store.set('zynx_session', user);
  $('auth-form').reset();
  enterApp();
});

$('signout').onclick = () => {
  user = null; store.set('zynx_session', null);
  $('app').classList.add('hidden'); $('auth').classList.remove('hidden'); setMode('in');
};

/* ---------- Chat ---------- */
let chats = [], current = null;
const key = () => 'zynx_chats_' + user.email;
const save = () => store.set(key(), chats);

function enterApp(){
  $('auth').classList.add('hidden'); $('app').classList.remove('hidden');
  $('uname').textContent = user.name; $('umail').textContent = user.email;
  $('avatar').textContent = user.name.charAt(0).toUpperCase();
  chats = store.get(key(), []);
  newChat();
}

function newChat(){
  current = { id: Date.now(), title: 'New chat', msgs: [] };
  render();
}

function render(){
  const col = $('col'); col.innerHTML = '';
  $('chat-title').textContent = current.title;
  if (!current.msgs.length) {
    const first = user.name.split(' ')[0];
    col.innerHTML = `<div class="hello"><h1>Good to see you, ${esc(first)}.</h1><p>Ask anything. Zynx is ready.</p>
      <div class="chips">${['Draft a professional email','Explain a concept simply','Help me debug code','Plan my week'].map(t => `<button class="chip" type="button">${t}</button>`).join('')}</div></div>`;
    col.querySelectorAll('.chip').forEach(c => c.onclick = () => send(c.textContent));
  } else current.msgs.forEach(m => bubble(m.text, m.role));
  renderSessions();
}

function renderSessions(){
  const box = $('sessions'); box.innerHTML = '';
  chats.forEach(c => {
    const b = document.createElement('button');
    b.className = 'session' + (c.id === current.id ? ' active' : '');
    b.textContent = c.title; b.type = 'button';
    b.onclick = () => { current = c; render(); };
    box.appendChild(b);
  });
}

function esc(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function bubble(text, role){
  const col = $('col');
  const d = document.createElement('div'); d.className = 'msg ' + role;
  const av = role === 'bot' ? '<div class="av"><i></i></div>' : `<div class="av">${esc(user.name.charAt(0).toUpperCase())}</div>`;
  d.innerHTML = av + '<div class="bubble"></div>';
  d.querySelector('.bubble').textContent = text;
  col.appendChild(d); $('msgs').scrollTop = $('msgs').scrollHeight;
  return d;
}

async function send(text){
  if (!current.msgs.length) {
    current.title = text.length > 34 ? text.slice(0, 34) + '…' : text;
    chats.unshift(current); $('col').innerHTML = '';
    $('chat-title').textContent = current.title;
  }
  current.msgs.push({ role:'user', text }); bubble(text, 'user'); renderSessions();

  const wait = bubble('', 'bot');
  wait.querySelector('.bubble').innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
  let reply;
  try {
    const r = await fetch('/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ message: text, user: user.email }) });
    const data = await r.json();
    reply = data.reply || 'No response received.';
  } catch { reply = 'Connection error. Check your connection and try again.'; }
  wait.remove(); current.msgs.push({ role:'bot', text: reply }); bubble(reply, 'bot'); save();
}

$('chat-form').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('user-input').value.trim(); if (!v) return;
  $('user-input').value = ''; send(v);
});
$('new-chat').onclick = newChat;

if (user) enterApp(); else setMode('in');
</script>
</body>
</html>
