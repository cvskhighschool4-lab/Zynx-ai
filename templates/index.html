<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zynx AI — Obsidian & Gold</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* Obsidian Black & Liquid Gold Marble Background */
        body {
            min-height: 100vh;
            background-color: #050505;
            background-image: 
                radial-gradient(ellipse at 12% 18%, rgba(212, 175, 55, 0.22) 0%, transparent 48%),
                radial-gradient(ellipse at 85% 82%, rgba(184, 134, 11, 0.24) 0%, transparent 52%),
                radial-gradient(ellipse at 52% 45%, rgba(255, 215, 0, 0.08) 0%, transparent 60%),
                repeating-linear-gradient(
                    125deg,
                    rgba(255, 255, 255, 0.015) 0px,
                    rgba(255, 255, 255, 0.015) 2px,
                    transparent 2px,
                    transparent 18px
                );
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #f8f5ec;
            position: relative;
        }

        /* Subtle Gold Marble Veins (SVG Overlay) */
        .marble-veins {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.45;
            pointer-events: none;
        }

        /* Ambient Shimmering Gold Orbs */
        .gold-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(85px);
            z-index: 0;
            animation: drift 12s infinite ease-in-out alternate;
        }

        .orb-gold-1 {
            width: 360px;
            height: 360px;
            background: rgba(212, 175, 55, 0.28);
            top: -70px;
            left: 14%;
        }

        .orb-gold-2 {
            width: 300px;
            height: 300px;
            background: rgba(245, 158, 11, 0.22);
            bottom: -50px;
            right: 10%;
            animation-delay: -6s;
        }

        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(25px, -35px) scale(1.08); }
        }

        /* Main Glassmorphism Shell */
        .app-shell {
            position: relative;
            z-index: 1;
            width: 94%;
            max-width: 1080px;
            height: 88vh;
            background: rgba(12, 11, 10, 0.55);
            backdrop-filter: blur(22px) saturate(140%);
            -webkit-backdrop-filter: blur(22px) saturate(140%);
            border: 1px solid rgba(212, 175, 55, 0.28);
            border-top: 1px solid rgba(255, 223, 128, 0.45);
            border-left: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: 26px;
            box-shadow: 0 28px 60px rgba(0, 0, 0, 0.85),
                        inset 0 0 28px rgba(212, 175, 55, 0.06);
            display: flex;
            overflow: hidden;
        }

        /* Transparent Frosted Sidebar */
        .sidebar {
            width: 260px;
            background: rgba(5, 5, 5, 0.32);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-right: 1px solid rgba(212, 175, 55, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 22px 18px;
        }

        .sidebar-top {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            padding-left: 4px;
        }

        .brand-emblem {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            transform: rotate(45deg);
            background: linear-gradient(135deg, #fde68a, #d4af37, #92400e);
            box-shadow: 0 0 14px rgba(212, 175, 55, 0.75);
        }

        .brand h1 {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.6px;
            background: linear-gradient(90deg, #fffbeb, #f5d061, #b4860b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .new-chat-btn {
            width: 100%;
            padding: 11px 14px;
            border-radius: 13px;
            background: rgba(212, 175, 55, 0.12);
            border: 1px solid rgba(212, 175, 55, 0.35);
            color: #fde68a;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .new-chat-btn:hover {
            background: rgba(212, 175, 55, 0.22);
            border-color: rgba(253, 230, 138, 0.6);
            box-shadow: 0 0 16px rgba(212, 175, 55, 0.2);
        }

        .history-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 6px;
        }

        .history-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(212, 175, 55, 0.65);
            padding-left: 6px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 11px;
            font-size: 0.85rem;
            color: rgba(248, 245, 236, 0.78);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.12);
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sidebar-footer {
            padding-top: 14px;
            border-top: 1px solid rgba(212, 175, 55, 0.18);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .dev-badge {
            font-size: 0.73rem;
            padding: 5px 11px;
            border-radius: 999px;
            background: rgba(212, 175, 55, 0.14);
            border: 1px solid rgba(212, 175, 55, 0.38);
            color: #f5d061;
            letter-spacing: 0.4px;
        }

        /* Translucent Chat Workspace */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(18, 16, 14, 0.28);
            position: relative;
        }

        .chat-header {
            padding: 18px 26px;
            background: rgba(10, 10, 10, 0.25);
            border-bottom: 1px solid rgba(212, 175, 55, 0.18);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .model-tag {
            font-size: 0.82rem;
            color: rgba(253, 230, 138, 0.85);
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.25);
            padding: 5px 12px;
            border-radius: 10px;
        }

        /* Translucent Chatbox Messages Area */
        .chat-box {
            flex: 1;
            padding: 24px 28px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .chat-box::-webkit-scrollbar {
            width: 5px;
        }
        .chat-box::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.35);
            border-radius: 10px;
        }

        /* Translucent Message Bubbles */
        .message {
            max-width: 78%;
            padding: 14px 18px;
            border-radius: 18px;
            line-height: 1.55;
            font-size: 0.95rem;
            word-wrap: break-word;
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.32), rgba(146, 104, 15, 0.38));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(253, 230, 138, 0.42);
            color: #fffbeb;
            border-bottom-right-radius: 5px;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
        }

        .bot-message {
            align-self: flex-start;
            background: rgba(15, 14, 12, 0.52);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(212, 175, 55, 0.22);
            color: #f3efe6;
            border-bottom-left-radius: 5px;
        }

        /* Translucent Typebox (Input Area) */
        .input-wrapper {
            padding: 16px 24px 22px;
            background: transparent;
        }

        .input-area {
            padding: 8px 10px 8px 18px;
            border-radius: 18px;
            background: rgba(12, 11, 10, 0.48);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(212, 175, 55, 0.32);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5),
                        inset 0 0 12px rgba(212, 175, 55, 0.06);
            display: flex;
            gap: 10px;
            align-items: center;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .input-area:focus-within {
            border-color: rgba(253, 230, 138, 0.65);
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.6),
                        0 0 18px rgba(212, 175, 55, 0.2);
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 4px;
            border: none;
            background: transparent;
            color: #fffbeb;
            font-size: 0.96rem;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: rgba(245, 208, 97, 0.45);
        }

        button[type="submit"] {
            padding: 11px 22px;
            border-radius: 13px;
            border: 1px solid rgba(254, 240, 138, 0.5);
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            color: #090806;
            font-weight: 700;
            font-size: 0.92rem;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 16px rgba(212, 175, 55, 0.35);
        }

        button[type="submit"]:hover {
            transform: translateY(-1px);
            background: linear-gradient(135deg, #f5d061, #c59318);
            box-shadow: 0 6px 22px rgba(212, 175, 55, 0.55);
        }

        button[type="submit"]:active {
            transform: translateY(1px);
        }

        .typing {
            font-style: italic;
            color: #f5d061;
            font-size: 0.88rem;
            opacity: 0.85;
        }

        /* Responsive Mobile Adjustments */
        @media (max-width: 720px) {
            .sidebar {
                display: none;
            }
            .app-shell {
                width: 96%;
                height: 92vh;
            }
        }
    </style>
</head>
<body>

    <!-- Gold Marble Veins Pattern Behind Glass -->
    <svg class="marble-veins" viewBox="0 0 1440 900" preserveAspectRatio="none">
        <defs>
            <linearGradient id="goldVein1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#d4af37" stop-opacity="0.05"/>
                <stop offset="50%" stop-color="#fde68a" stop-opacity="0.55"/>
                <stop offset="100%" stop-color="#92400e" stop-opacity="0.08"/>
            </linearGradient>
            <linearGradient id="goldVein2" x1="100%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#b4860b" stop-opacity="0.05"/>
                <stop offset="45%" stop-color="#f5d061" stop-opacity="0.4"/>
                <stop offset="100%" stop-color="#78350f" stop-opacity="0.05"/>
            </linearGradient>
        </defs>
        <path d="M-50,180 C240,290 420,90 740,240 C1060,390 1220,140 1500,260" fill="none" stroke="url(#goldVein1)" stroke-width="2.5"/>
        <path d="M-40,560 C310,430 580,690 910,510 C1180,360 1320,580 1510,490" fill="none" stroke="url(#goldVein2)" stroke-width="2"/>
        <path d="M220,-30 C360,260 180,520 460,930" fill="none" stroke="url(#goldVein1)" stroke-width="1.5"/>
        <path d="M980,-40 C860,310 1120,610 890,940" fill="none" stroke="url(#goldVein2)" stroke-width="1.8"/>
    </svg>

    <!-- Ambient Gold Glows -->
    <div class="gold-orb orb-gold-1"></div>
    <div class="gold-orb orb-gold-2"></div>

    <!-- Main Frosted Glass Application -->
    <div class="app-shell">
        <!-- Transparent Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-top">
                <div class="brand">
                    <div class="brand-emblem"></div>
                    <h1>Zynx AI</h1>
                </div>

                <button class="new-chat-btn" id="clear-chat" type="button">
                    <span>+ New Session</span>
                    <span>✦</span>
                </button>

                <div class="history-section">
                    <span class="history-label">Workspace</span>
                    <div class="history-item">Active Groq Session</div>
                </div>
            </div>

            <div class="sidebar-footer">
                <span class="dev-badge">Dev Access</span>
            </div>
        </aside>

        <!-- Translucent Chat Area -->
        <main class="chat-main">
            <div class="chat-header">
                <span class="model-tag">Zynx Engine • Groq</span>
            </div>

            <div class="chat-box" id="chat-box">
                <div class="message bot-message">
                    Welcome to Zynx AI. How can I assist you today?
                </div>
            </div>

            <!-- Translucent Typebox -->
            <div class="input-wrapper">
                <form class="input-area" id="chat-form">
                    <input type="text" id="user-input" placeholder="Message Zynx AI..." autocomplete="off" required>
                    <button type="submit">Send</button>
                </form>
            </div>
        </main>
    </div>

    <script>
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');
        const clearBtn = document.getElementById('clear-chat');

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.textContent = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }

        clearBtn.addEventListener('click', () => {
            chatBox.innerHTML = '<div class="message bot-message">Session cleared. How can I assist you?</div>';
        });

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage(message, 'user-message');
            userInput.value = '';

            const loadingMsg = appendMessage('Zynx is thinking...', 'bot-message typing');

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                loadingMsg.remove();
                appendMessage(data.reply || 'No response received.', 'bot-message');
            } catch (error) {
                loadingMsg.remove();
                appendMessage('Connection error. Please try again.', 'bot-message');
            }
        });
    </script>
</body>
</html>
