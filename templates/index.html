<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zynx AI</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04050b; --panel:rgba(10,12,26,.8); --surf:rgba(255,255,255,.04); --line:rgba(150,165,255,.13); --line2:rgba(150,165,255,.3);
  --txt:#e9ecff; --mut:#8a92b8; --acc:#8fa2ff; --acc2:#5fd4ff; --danger:#ff8f9e;
  --sans:'Space Grotesk',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--txt);background:var(--bg);overflow:hidden;
  background-image:radial-gradient(ellipse 70% 55% at 80% -10%,rgba(110,90,255,.22),transparent 70%),radial-gradient(ellipse 60% 50% at 0% 100%,rgba(40,120,220,.16),transparent 70%)}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hidden{display:none!important}
body.booting .app,body.booting .auth{opacity:0}
.app,.auth{transition:opacity .9s ease .2s}

.planet{position:relative;width:18px;height:18px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d8dfff,#6b7cff 55%,#1a1e50);box-shadow:0 0 16px rgba(143,162,255,.5)}
.planet::after{content:"";position:absolute;left:-7px;right:-7px;top:50%;height:7px;margin-top:-3.5px;border:1.5px solid rgba(190,205,255,.8);border-radius:50%;transform:rotate(-20deg)}
.logo{display:flex;align-items:center;gap:12px;font-weight:700;font-size:1.15rem;letter-spacing:.04em}

/* Startup */
.boot{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;cursor:pointer;transition:opacity 1s ease,visibility 1s}
.boot.done{opacity:0;visibility:hidden}
.boot .planet{width:56px;height:56px;box-shadow:0 0 50px rgba(143,162,255,.55);animation:rise 1.6s cubic-bezier(.2,.7,.2,1) both}
.boot .planet::after{left:-26px;right:-26px;height:22px;margin-top:-11px;border-width:2px}
@keyframes rise{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.boot-word{font-size:2rem;font-weight:700;letter-spacing:.5em;padding-left:.5em;animation:fade 1.6s ease .3s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.boot-bar{width:200px;height:2px;background:rgba(150,165,255,.15);border-radius:2px;overflow:hidden}
.boot-bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .5s ease}
.boot-status{height:18px;font-size:.82rem;color:var(--mut);font-family:var(--mono)}

/* Auth */
.auth{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:410px;padding:38px 34px 30px;border-radius:20px;background:var(--panel);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);box-shadow:0 40px 90px rgba(0,0,0,.6)}
.card .logo{margin-bottom:26px}
.card h2{font-size:1.7rem;font-weight:600;letter-spacing:-.02em;margin-bottom:6px}
.sub{color:var(--mut);font-size:.9rem;margin-bottom:22px}
.tabs{display:flex;padding:4px;border-radius:11px;background:var(--surf);border:1px solid var(--line);margin-bottom:20px}
.tab{flex:1;padding:9px;border:0;border-radius:8px;background:none;color:var(--mut);font-weight:500;font-size:.88rem;cursor:pointer}
.tab[aria-selected="true"]{background:rgba(143,162,255,.16);color:var(--txt)}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.field label{font-size:.8rem;color:var(--mut)}
.field input{padding:12px 14px;border-radius:10px;background:rgba(0,0,0,.35);border:1px solid var(--line);outline:none;transition:border-color .2s,box-shadow .2s}
.field input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(143,162,255,.15)}
.err{min-height:20px;font-size:.84rem;color:var(--danger);margin-bottom:8px}
.btn{width:100%;padding:12px;border:0;border-radius:10px;cursor:pointer;font-weight:600;color:#070a1c;background:linear-gradient(135deg,#b9c5ff,var(--acc));transition:box-shadow .2s,transform .15s}
.btn:hover{box-shadow:0 8px 26px rgba(143,162,255,.35);transform:translateY(-1px)}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
.switch{margin-top:18px;text-align:center;font-size:.86rem;color:var(--mut)}
.switch button{background:none;border:0;color:var(--acc);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* App shell */
.app{position:fixed;inset:0;z-index:1;display:flex}
.side{width:260px;flex:none;display:flex;flex-direction:column;padding:18px 12px 14px;background:rgba(6,8,18,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-right:1px solid var(--line)}
.side .logo{margin:2px 8px 18px}
.new{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surf);font-size:.88rem;font-weight:500;cursor:pointer;transition:border-color .2s,background .2s}
.new:hover{border-color:var(--line2);background:rgba(143,162,255,.1)}
.new span:first-child{color:var(--acc);font-size:1.1rem;line-height:1}
.label{margin:20px 10px 8px;font-size:.78rem;color:var(--mut);font-weight:500}
.tasks{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.task{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:8px;background:none;text-align:left;font-size:.86rem;color:rgba(233,236,255,.78);cursor:pointer}
.task:hover{background:var(--surf)}
.task.on{background:rgba(143,162,255,.12);color:var(--txt)}
.task i{width:7px;height:7px;flex:none;border-radius:50%;background:var(--acc2)}
.task.run i{animation:pulse 1s infinite ease-in-out}
@keyframes pulse{50%{opacity:.25}}
.task span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me{display:flex;align-items:center;gap:10px;padding:12px 6px 0;margin-top:10px;border-top:1px solid var(--line)}
.av{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;color:#070a1c;background:linear-gradient(135deg,#b9c5ff,var(--acc2))}
.who{flex:1;min-width:0}
.who b{display:block;font-size:.86rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;color:var(--mut);font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.out{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.76rem;color:var(--mut);cursor:pointer}
.out:hover{color:var(--txt);border-color:var(--line2)}

.main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 26px}
.top h3{font-size:.92rem;font-weight:500;color:var(--mut)}
.pill{font-size:.76rem;font-family:var(--mono);color:var(--acc);padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:rgba(143,162,255,.07)}
.hero{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;padding:0 24px 9vh}
.main.empty .hero{display:flex}
.main.empty .msgs,.main.empty .dock{display:none}
.hero h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:600;letter-spacing:-.03em;margin-bottom:26px;text-align:center}
.slot{width:100%;max-width:760px}
.sugg{width:100%;max-width:760px;margin-top:18px;display:flex;flex-direction:column}
.sg{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:.9rem;color:rgba(233,236,255,.72);cursor:pointer;transition:color .2s,background .2s}
.sg:last-child{border-bottom:0}
.sg:hover{color:var(--txt);background:var(--surf)}
.sg span:last-child{color:var(--acc);opacity:0;transition:opacity .2s}
.sg:hover span:last-child{opacity:1}

.composer{width:100%;max-width:760px;margin:0 auto;padding:14px 14px 10px 18px;border-radius:18px;background:rgba(12,14,30,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line2);box-shadow:0 20px 50px rgba(0,0,0,.45);transition:border-color .2s,box-shadow .2s}
.composer:focus-within{border-color:var(--acc);box-shadow:0 20px 50px rgba(0,0,0,.45),0 0 0 3px rgba(143,162,255,.12)}
.composer textarea{display:block;width:100%;resize:none;border:0;outline:none;background:none;font-size:.97rem;line-height:1.55;max-height:200px;padding:2px 0 10px}
.composer textarea::placeholder{color:rgba(138,146,184,.75)}
.crow{display:flex;align-items:center;gap:12px}
.seg{display:flex;padding:3px;border-radius:9px;background:var(--surf);border:1px solid var(--line)}
.seg button{padding:5px 13px;border:0;border-radius:6px;background:none;color:var(--mut);font-size:.8rem;font-weight:500;cursor:pointer}
.seg button.on{background:rgba(143,162,255,.2);color:var(--txt)}
.hint{flex:1;font-size:.74rem;color:var(--mut);font-family:var(--mono)}
.send{width:36px;height:36px;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:linear-gradient(135deg,#b9c5ff,var(--acc));transition:box-shadow .2s,transform .15s}
.send:hover{box-shadow:0 6px 20px rgba(143,162,255,.4);transform:translateY(-1px)}
.send svg{width:17px;height:17px;stroke:#070a1c;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.dock{padding:6px 24px 20px}

.msgs{flex:1;overflow-y:auto;padding:12px 0 24px;scroll-behavior:smooth}
.msgs::-webkit-scrollbar,.tasks::-webkit-scrollbar{width:5px}
.msgs::-webkit-scrollbar-thumb,.tasks::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
.col{max-width:760px;margin:0 auto;padding:0 26px;display:flex;flex-direction:column;gap:26px}
.m{animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.m.user{align-self:flex-end;max-width:82%;padding:11px 16px;border-radius:16px;background:rgba(143,162,255,.14);border:1px solid var(--line2);line-height:1.6;font-size:.94rem;white-space:pre-wrap;word-wrap:break-word}
.m.bot{display:flex;gap:14px;align-items:flex-start}
.m.bot .planet{margin:5px 8px 0 8px;transform:scale(.8)}
.body{flex:1;min-width:0;line-height:1.7;font-size:.95rem;word-wrap:break-word}
.body p{margin-bottom:12px}.body p:last-child{margin-bottom:0}
.body code{font-family:var(--mono);font-size:.84em;padding:2px 6px;border-radius:6px;background:rgba(143,162,255,.14)}
.cb{margin:14px 0;border-radius:12px;overflow:hidden;border:1px solid var(--line2);background:rgba(3,4,12,.75)}
.ch{display:flex;justify-content:space-between;align-items:center;padding:7px 8px 7px 14px;background:rgba(143,162,255,.08);border-bottom:1px solid var(--line);font-family:var(--mono);font-size:.74rem;color:var(--mut)}
.cp{background:none;border:1px solid var(--line);border-radius:7px;padding:3px 10px;font-size:.74rem;color:var(--mut);cursor:pointer}
.cp:hover{color:var(--txt);border-color:var(--line2)}
.cb pre{padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:.84rem;line-height:1.65}
.cb pre code{padding:0;background:none;font-size:inherit}
.dots{display:inline-flex;gap:5px;padding:9px 0}
.dots span{width:6px;height:6px;border-radius:50%;background:var(--acc);animation:b 1.1s infinite ease-in-out}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

@media (max-width:760px){
  .side{display:none}.top{padding:12px 16px}.col,.dock{padding-left:14px;padding-right:14px}.hint{display:none}.card{padding:30px 22px 24px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="booting">
<canvas id="sky" aria-hidden="true"></canvas>

<div class="boot" id="boot" aria-live="polite">
  <div class="planet"></div>
  <div class="boot-word">ZYNX</div>
  <div class="boot-bar"><b id="boot-fill"></b></div>
  <div class="boot-status" id="boot-status"></div>
</div>

<section class="auth" id="auth">
  <div class="card">
    <div class="logo"><div class="planet"></div><span>Zynx AI</span></div>
    <h2 id="auth-title">Welcome back</h2>
    <p class="sub" id="auth-sub">Sign in to pick up where you left off.</p>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-in" aria-selected="true" type="button">Sign in</button>
      <button class="tab" role="tab" id="tab-up" aria-selected="false" type="button">Sign up</button>
    </div>
    <form id="auth-form" novalidate>
      <div class="field hidden" id="name-field"><label for="name">Full name</label><input id="name" type="text" autocomplete="name" placeholder="Ada Lovelace"></div>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="At least 8 characters"></div>
      <div class="err" id="err" role="alert"></div>
      <button class="btn" id="auth-btn" type="submit">Sign in</button>
    </form>
    <p class="switch" id="switch">New to Zynx? <button type="button" id="switch-btn">Create an account</button></p>
  </div>
</section>

<div class="app hidden" id="app">
  <aside class="side">
    <div class="logo"><div class="planet"></div><span>Zynx AI</span></div>
    <button class="new" id="new-chat" type="button"><span>+</span><span>New task</span></button>
    <div class="label">Tasks</div>
    <div class="tasks" id="tasks"></div>
    <div class="me">
      <div class="av" id="avatar">Z</div>
      <div class="who"><b id="uname">User</b><small id="umail"></small></div>
      <button class="out" id="signout" type="button">Sign out</button>
    </div>
  </aside>
  <main class="main empty" id="main">
    <div class="top"><h3 id="title">New task</h3><span class="pill">zynx-engine · groq</span></div>
    <div class="hero">
      <h1 id="hello">What should we build?</h1>
      <div class="slot" id="slot">
        <form class="composer" id="composer" autocomplete="off">
          <textarea id="user-input" rows="1" aria-label="Message"></textarea>
          <div class="crow">
            <div class="seg"><button type="button" class="on" data-m="ask">Ask</button><button type="button" data-m="code">Code</button></div>
            <span class="hint">Enter to send · Shift+Enter for new line</span>
            <button class="send" type="submit" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
          </div>
        </form>
      </div>
      <div class="sugg" id="sugg"></div>
    </div>
    <div class="msgs" id="msgs"><div class="col" id="col"></div></div>
    <div class="dock" id="dock"></div>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Starfield (warps during startup, then drifts) ---------- */
const sky = $('sky'), g = sky.getContext('2d');
let W, H, speed = reduce ? 0.3 : 16, target = reduce ? 0.3 : 0.35;
const stars = Array.from({ length: 280 }, () => ({ x: Math.random() * 2 - 1, y: Math.random() * 2 - 1, z: Math.random() * 0.95 + 0.05, t: Math.random() * 6 }));
function size(){ W = sky.width = innerWidth; H = sky.height = innerHeight; }
addEventListener('resize', size); size();
const proj = (s, z) => [W / 2 + s.x / z * W * 0.22, H / 2 + s.y / z * W * 0.22];
function frame(){
  g.clearRect(0, 0, W, H);
  speed += (target - speed) * 0.03;
  for (const s of stars) {
    s.z -= speed * 0.0006; s.t += 0.03;
    let [x, y] = proj(s, s.z);
    if (s.z < 0.03 || x < -50 || x > W + 50 || y < -50 || y > H + 50) { s.x = Math.random() * 2 - 1; s.y = Math.random() * 2 - 1; s.z = 1; continue; }
    const a = (1 - s.z) * 0.9 + 0.1, tw = speed > 3 ? 1 : 0.65 + Math.sin(s.t) * 0.35;
    g.strokeStyle = g.fillStyle = `rgba(200,212,255,${a * tw})`;
    if (speed > 2.5) { const [px, py] = proj(s, s.z + speed * 0.0018); g.lineWidth = (1 - s.z) * 2; g.beginPath(); g.moveTo(px, py); g.lineTo(x, y); g.stroke(); }
    else { g.beginPath(); g.arc(x, y, (1 - s.z) * 1.6 + 0.3, 0, 6.3); g.fill(); }
  }
  requestAnimationFrame(frame);
}
frame();

/* ---------- Startup sequence (click or Esc to skip) ---------- */
let user = store.get('zynx_session', null);
const bootSteps = ['Powering up', 'Connecting to Groq', user ? 'Restoring your session' : 'Preparing sign in', 'Ready'];
let bi = 0, booted = false, bt;
function finishBoot(){
  if (booted) return; booted = true; clearInterval(bt);
  target = reduce ? 0.3 : 0.35;
  document.body.classList.remove('booting');
  $('boot').classList.add('done'); setTimeout(() => $('boot').remove(), 1100);
}
function bootTick(){
  $('boot-status').textContent = bootSteps[bi];
  $('boot-fill').style.width = ((bi + 1) / bootSteps.length * 100) + '%';
  if (bi === bootSteps.length - 1) { clearInterval(bt); setTimeout(finishBoot, 600); }
  bi++;
}
bootTick(); bt = setInterval(bootTick, 650);
$('boot').addEventListener('click', finishBoot);
document.addEventListener('keydown', e => { if (e.key === 'Escape') finishBoot(); });

/* ---------- Auth ---------- */
let mode = 'in';
function setMode(m){
  mode = m; const up = m === 'up';
  $('tab-in').setAttribute('aria-selected', !up); $('tab-up').setAttribute('aria-selected', up);
  $('name-field').classList.toggle('hidden', !up);
  $('auth-title').textContent = up ? 'Create your account' : 'Welcome back';
  $('auth-sub').textContent = up ? 'Start building with Zynx in under a minute.' : 'Sign in to pick up where you left off.';
  $('auth-btn').textContent = up ? 'Create account' : 'Sign in';
  $('password').autocomplete = up ? 'new-password' : 'current-password';
  $('switch').firstChild.textContent = up ? 'Already have an account? ' : 'New to Zynx? ';
  $('switch-btn').textContent = up ? 'Sign in' : 'Create an account';
  $('err').textContent = '';
}
$('tab-in').onclick = () => setMode('in');
$('tab-up').onclick = () => setMode('up');
$('switch-btn').onclick = () => setMode(mode === 'in' ? 'up' : 'in');

async function hash(s){
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch { return btoa(unescape(encodeURIComponent(s))); }
}
/* Tries your backend (/api/signup, /api/login); falls back to browser-only demo accounts if those routes don't exist. */
async function authRequest(path, body){
  try {
    const r = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    if (r.status === 404 || r.status === 405) return { local:true };
    return { ok:r.ok, data: await r.json().catch(() => ({})) };
  } catch { return { local:true }; }
}
$('auth-form').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('name').value.trim(), email = $('email').value.trim().toLowerCase(), pw = $('password').value;
  const err = m => { $('err').textContent = m; }; err('');
  if (mode === 'up' && name.length < 2) return err('Enter your full name.');
  if (!/^\S+@\S+\.\S+$/.test(email)) return err('Enter a valid email address.');
  if (pw.length < 8) return err('Password must be at least 8 characters.');
  const btn = $('auth-btn'); btn.disabled = true;
  const res = await authRequest(mode === 'up' ? '/api/signup' : '/api/login', { name, email, password: pw });
  let session = null;
  if (res.local) {
    const users = store.get('zynx_users', {}), h = await hash(pw);
    if (mode === 'up') {
      if (users[email]) { btn.disabled = false; return err('An account with this email already exists. Sign in instead.'); }
      users[email] = { name, h }; store.set('zynx_users', users); session = { name, email };
    } else {
      const u = users[email];
      if (!u || u.h !== h) { btn.disabled = false; return err('Email or password is incorrect.'); }
      session = { name: u.name, email };
    }
  } else if (res.ok) session = { name: res.data.name || name || email.split('@')[0], email };
  else { btn.disabled = false; return err(res.data.error || res.data.message || 'Something went wrong. Try again.'); }
  btn.disabled = false; user = session; store.set('zynx_session', user);
  $('auth-form').reset(); enterApp();
});
$('signout').onclick = () => {
  user = null; store.set('zynx_session', null);
  $('app').classList.add('hidden'); $('auth').classList.remove('hidden'); setMode('in');
};

/* ---------- Chat ---------- */
let chats = [], cur = null, chatMode = 'ask';
const key = () => 'zynx_chats_' + user.email;
const save = () => store.set(key(), chats);
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const suggestions = ['Explain this error and how to fix it', 'Write a debounce function in JavaScript', 'Review my code for bugs and edge cases', 'Plan the folder structure for a REST API'];

function md(t){
  return t.split(/```(\w*)\n?([\s\S]*?)```/g).map((p, i) => {
    if (i % 3 === 1) return '';
    if (i % 3 === 2) return `<div class="cb"><div class="ch"><span>${esc(t.split(/```(\w*)\n?([\s\S]*?)```/g)[i - 1] || 'code')}</span><button class="cp" type="button">Copy</button></div><pre><code>${esc(p.replace(/\n$/, ''))}</code></pre></div>`;
    return esc(p).split(/\n{2,}/).filter(x => x.trim()).map(x => '<p>' + x.replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>') + '</p>').join('');
  }).join('');
}

function enterApp(){
  $('auth').classList.add('hidden'); $('app').classList.remove('hidden');
  $('uname').textContent = user.name; $('umail').textContent = user.email;
  $('avatar').textContent = user.name.charAt(0).toUpperCase();
  $('hello').textContent = 'What should we build, ' + user.name.split(' ')[0] + '?';
  chats = store.get(key(), []); newChat();
}
function newChat(){ cur = { id: Date.now(), title: 'New task', msgs: [] }; render(); $('user-input').focus(); }

function render(){
  const empty = !cur.msgs.length;
  $('main').classList.toggle('empty', empty);
  (empty ? $('slot') : $('dock')).appendChild($('composer'));
  $('title').textContent = cur.title;
  const col = $('col'); col.innerHTML = '';
  cur.msgs.forEach(m => addMsg(m.text, m.role));
  $('sugg').innerHTML = suggestions.map(s => `<button class="sg" type="button"><span>${s}</span><span>→</span></button>`).join('');
  $('sugg').querySelectorAll('.sg').forEach(b => b.onclick = () => { $('user-input').value = b.firstChild.textContent; grow(); $('user-input').focus(); });
  renderTasks();
}
function renderTasks(){
  const box = $('tasks'); box.innerHTML = '';
  chats.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'task' + (c.id === cur.id ? ' on' : '') + (c.busy ? ' run' : '');
    b.innerHTML = '<i></i><span></span>'; b.lastChild.textContent = c.title;
    b.onclick = () => { cur = c; render(); };
    box.appendChild(b);
  });
}
function addMsg(text, role){
  const d = document.createElement('div'); d.className = 'm ' + role;
  if (role === 'user') d.textContent = text;
  else { d.innerHTML = '<div class="planet"></div><div class="body"></div>'; d.lastChild.innerHTML = md(text); }
  $('col').appendChild(d); $('msgs').scrollTop = $('msgs').scrollHeight; return d;
}

async function send(text){
  if (!cur.msgs.length) {
    cur.title = text.length > 36 ? text.slice(0, 36) + '…' : text; chats.unshift(cur);
    cur.msgs.push({ role:'user', text }); render();
  } else { cur.msgs.push({ role:'user', text }); addMsg(text, 'user'); }
  const chat = cur; chat.busy = true; renderTasks();
  const wait = addMsg('', 'bot'); wait.lastChild.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
  let reply;
  try {
    const r = await fetch('/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ message: text, user: user.email, mode: chatMode }) });
    reply = (await r.json()).reply || 'No response received.';
  } catch { reply = 'Connection error. Check your connection and try again.'; }
  chat.busy = false; chat.msgs.push({ role:'bot', text: reply }); save();
  if (cur === chat) { wait.remove(); addMsg(reply, 'bot'); } renderTasks();
}

const ta = $('user-input');
const placeholders = { ask: 'Ask Zynx anything', code: 'Describe a task for Zynx to code' };
function grow(){ ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 200) + 'px'; }
ta.placeholder = placeholders.ask; ta.addEventListener('input', grow);
ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('composer').requestSubmit(); } });
$('composer').addEventListener('submit', e => { e.preventDefault(); const v = ta.value.trim(); if (!v) return; ta.value = ''; grow(); send(v); });
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
  chatMode = b.dataset.m; ta.placeholder = placeholders[chatMode];
  document.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b));
});
$('col').addEventListener('click', e => {
  const b = e.target.closest('.cp'); if (!b) return;
  const code = b.closest('.cb').querySelector('code').textContent;
  try { navigator.clipboard.writeText(code); b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1400); } catch {}
});
$('new-chat').onclick = newChat;

if (user) enterApp(); else setMode('in');
</script>
</body>
</html>
